<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">

  <!-- Fondo blanco con borde sutil — mismo estilo que el logo real -->
  <rect width="512" height="512" rx="80" fill="#ffffff"/>
  <rect width="512" height="512" rx="80" fill="none" stroke="#cccccc" stroke-width="10"/>

  <!-- Ala izquierda negra -->
  <polygon points="42,44 232,44 250,400 42,400" fill="#111111"/>

  <!-- Ala derecha negra (espejo) -->
  <polygon points="470,44 280,44 262,400 470,400" fill="#111111"/>

  <!-- Haz laser rojo — glow exterior suave -->
  <rect x="243" y="26" width="26" height="360" rx="13" fill="#cc1122" opacity="0.22"/>
  <!-- Haz laser rojo — núcleo -->
  <rect x="249" y="26" width="14" height="360" rx="7" fill="#cc1122"/>

  <!-- Estrella / destello en punto de impacto -->
  <!-- Estrella de 4 puntas -->
  <g transform="translate(256,408)">
    <path d="M0,-42 L11,-11 L42,0 L11,11 L0,42 L-11,11 L-42,0 L-11,-11 Z" fill="#cc1122"/>
    <!-- Destellos diagonales cortos -->
    <line x1="-30" y1="-30" x2="-20" y2="-20" stroke="#cc1122" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
    <line x1="30"  y1="-30" x2="20"  y2="-20" stroke="#cc1122" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
    <line x1="-30" y1="30"  x2="-20" y2="20"  stroke="#cc1122" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
    <line x1="30"  y1="30"  x2="20"  y2="20"  stroke="#cc1122" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
    <!-- Centro brillante -->
    <circle r="14" fill="#cc1122"/>
    <circle r="7"  fill="#ff4455"/>
  </g>

</svg>
