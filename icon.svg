<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
  </defs>

  <!-- Fondo negro con bordes redondeados -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>

  <!-- Línea roja superior decorativa -->
  <rect x="60" y="52" width="392" height="8" rx="4" fill="#cc1122"/>

  <!-- M roja bold estilizada (como el logo) -->
  <!-- Trazo izquierdo del M -->
  <path d="M72 380 L72 160 L256 290 L440 160 L440 380"
        stroke="#cc1122" stroke-width="52" fill="none"
        stroke-linejoin="miter" stroke-linecap="square"/>

  <!-- Relleno blanco interior del M para dar profundidad -->
  <path d="M90 370 L90 192 L256 310 L422 192 L422 370"
        stroke="#000" stroke-width="16" fill="none"
        stroke-linejoin="miter"/>

  <!-- Línea roja inferior -->
  <rect x="60" y="420" width="392" height="8" rx="4" fill="#cc1122"/>

  <!-- Texto STOCK en blanco -->
  <text x="256" y="484"
        font-family="Arial Black, Impact, sans-serif"
        font-size="48" font-weight="900"
        fill="white" text-anchor="middle"
        letter-spacing="12">STOCK</text>
</svg>
